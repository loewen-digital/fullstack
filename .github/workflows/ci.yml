name: CI

# The library shape of the org snippet (loewen-digital/agent-loop, snippets/ci.yml): one job on every
# push to main and every pull request, a push that touches nothing but docs or Markdown runs nothing
# (docs.yml deploys the docs). No tags trigger and no tag guard: release.yml publishes the package.

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the running one. The expression is the
# snippet's, kept verbatim so the file stays diffable against it; there are no tags here.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Check, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Format, lint, types
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
